name: Windows Testbox Probe

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Exact commit SHA to verify"
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  proof:
    name: SQLite CLI history proof
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact target
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.target_ref }}
          persist-credentials: false
          submodules: false

      - name: Verify exact target
        env:
          EXPECTED_HEAD: ${{ inputs.target_ref }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          node-version: 24.x

      - name: Run focused regression
        run: node scripts/run-vitest.mjs src/agents/cli-runner/session-history.test.ts --no-coverage
