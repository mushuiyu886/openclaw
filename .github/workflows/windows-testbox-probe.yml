name: Windows Testbox Probe

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Exact commit SHA to verify"
        required: true
        type: string
      base_ref:
        description: "Exact upstream base SHA for diff validation"
        required: true
        type: string
      merge_base_ref:
        description: "Exact PR merge-base SHA for patch validation"
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  proof:
    name: SQLite CLI history proof
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact target
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.target_ref }}
          persist-credentials: false
          submodules: false

      - name: Verify exact target
        env:
          EXPECTED_HEAD: ${{ inputs.target_ref }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Fetch exact upstream base
        env:
          EXPECTED_BASE: ${{ inputs.base_ref }}
          EXPECTED_MERGE_BASE: ${{ inputs.merge_base_ref }}
        run: |
          git fetch --no-tags --depth=1 https://github.com/openclaw/openclaw.git "$EXPECTED_BASE"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_BASE"
          git fetch --no-tags --depth=1 https://github.com/openclaw/openclaw.git \
            "$EXPECTED_MERGE_BASE:refs/remotes/upstream/pr-merge-base"
          test "$(git rev-parse refs/remotes/upstream/pr-merge-base)" = "$EXPECTED_MERGE_BASE"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          node-version: 24.x

      - name: Run focused regression
        run: >-
          node scripts/run-vitest.mjs
          src/agents/cli-runner/session-history.test.ts
          src/agents/cli-runner/session-history.sqlite.test.ts
          --no-coverage

      - name: Check formatting and lint
        run: |
          node_modules/.bin/oxfmt --check \
            src/agents/cli-runner.ts \
            src/agents/cli-runner/prepare.ts \
            src/agents/cli-runner/session-history.ts \
            src/agents/cli-runner/session-history.test.ts \
            src/agents/cli-runner/session-history.sqlite.test.ts \
            src/config/sessions/session-accessor.sqlite-read.ts \
            src/config/sessions/session-accessor.sqlite.ts \
            src/config/sessions/session-accessor.transcript.ts \
            src/config/sessions/session-accessor.ts
          node_modules/.bin/oxlint \
            src/agents/cli-runner/session-history.ts \
            src/agents/cli-runner/session-history.test.ts \
            src/agents/cli-runner/session-history.sqlite.test.ts \
            src/config/sessions/session-accessor.sqlite-read.ts \
            src/config/sessions/session-accessor.sqlite.ts \
            src/config/sessions/session-accessor.transcript.ts \
            src/config/sessions/session-accessor.ts

      - name: Check core types
        run: |
          mkdir -p .artifacts/tsgo-cache
          node scripts/run-tsgo.mjs -p tsconfig.core.json --incremental \
            --tsBuildInfoFile .artifacts/tsgo-cache/core.tsbuildinfo

      - name: Check patch whitespace
        run: git diff --check refs/remotes/upstream/pr-merge-base HEAD
